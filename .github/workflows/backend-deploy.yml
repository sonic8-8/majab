name: Backend Deploy To EC2

on:
  push:
    branches:
      - develop
    paths:
      - backend/**


jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Gihub Repository 파일 불러오기
        uses: actions/checkout@v4
      
      - name: JDK 17버전 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
        
      - name: application.yml 파일 만들기
        run: |
          mkdir backend/src/main/resources || true
          echo "${{ secrets. APPLICATION_PROPERTIES }}" > backend/src/main/resources/application.yml

      - name: 테스트 및 빌드하기
        run: ./gradlew clean build
        working-directory: ./backend

      - name: AWS Resource에 접근할 수 있게 AWS credentials 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: ECR에 로그인하기
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker 이미지 생성
        run: docker build -t majab-server .

      - name: Docker 이미지에 Tag 붙이기
        run: docker tag majab-server ${{ steps.login-ecr.outputs.registry }}/majab-server:latest

      - name: ECR에 Docker 이미지 Push
        run: docker push ${{ steps.login-ecr.outputs.registry }}/majab-server:latest

      - name: SSH로 EC2에 접속하기
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script_stop: true
          script: |
            docker stop majab-server || true
            docker rm majab-server || true
            docker pull ${{ steps.login-ecr.outputs.registry }}/majab-server:latest
            docker run -d --name majab-server -p 8080:8080 ${{ steps.login-ecr.outputs.registry }}/majab-server:latest